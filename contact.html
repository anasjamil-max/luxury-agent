<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Contact Luxury Agent - Get in touch with our luxury real estate advisors.">
  <title>Luxury Agent | Contact</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@100..900&family=Geist:wght@100..900&family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Plus+Jakarta+Sans:ital,wght@0,300..800;1,300..800&display=swap"
    rel="stylesheet">

  <!-- Lenis Smooth Scroll -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lenis@1.1.18/dist/lenis.css">
  <script src="https://cdn.jsdelivr.net/npm/lenis@1.1.18/dist/lenis.min.js"></script>

  <!-- Core Stylesheet -->
  <link rel="stylesheet" href="css/style.css">

  <!-- JavaScript -->
  <script src="js/main.js" defer></script>

<body>
  <!-- Fixed Background Layer -->
  <div class="bg-container" aria-hidden="true"></div>
  <div class="bg-overlay" aria-hidden="true"></div>

  <!-- Page Content Structure -->
  <div class="site-wrapper">
    <main class="hero-view">
      <div class="container">
        <h1 class="hero-title">Market <br>yourself like<br> the top 1%.</h1>
        <div class="hero-divider" aria-hidden="true"></div>
        <p class="hero-subtext">Build your brand, win more listings, and stay top of mind.</p>
        <a href="#social-content" class="btn btn-glass hero-btn">GET STARTED</a>
      </div>
    </main>

    <!-- Scrollable Section 2 -->
    <section class="section-view" id="social-content">
      <div class="container">
        <h2 class="hero-title">Done-for-you<br> social content.<br> Every week.</h2>
        <div class="hero-divider" aria-hidden="true"></div>
        <p class="hero-subtext">Posts, carousels, stories, reels, and more—planned and created around your brand and local market.</p>
      </div>
    </section>
  </div>
