<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Contact Luxury Agent - Let's talk about marketing your properties like the top 1%">
  <title>Contact Us | Luxury Agent</title>

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="../images/favicon.png">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@100..900&family=Geist:wght@100..900&family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Plus+Jakarta+Sans:ital,wght@0,300..800;1,300..800&display=swap"
    rel="stylesheet">

  <!-- Lenis Smooth Scroll -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lenis@1.1.18/dist/lenis.css">
  <script src="https://cdn.jsdelivr.net/npm/lenis@1.1.18/dist/lenis.min.js"></script>

  <!-- Core Stylesheet -->
  <link rel="stylesheet" href="../css/style.css">

  <!-- JavaScript -->
  <script src="../js/main.js" defer></script>
</head>

<body>
  <!-- Fixed Background Layer -->
  <div class="bg-container" aria-hidden="true"></div>
  <div class="bg-overlay" aria-hidden="true"></div>

  <!-- Site Wrapper -->
  <div class="site-wrapper contact-wrapper">
    <!-- Top-Left Back Button -->
    <a href="/" class="contact-back-btn btn btn-glass">
      &larr; BACK
    </a>

    <!-- Main Contact Section -->
    <main class="contact-main">
      <div class="container contact-container">
        <h1 class="hero-title contact-title">Let's Talk.</h1>
        <p class="contact-subtext">Fill out the form below and we'll get back to you within 24 hours.</p>

        <!-- Contact Form -->
        <form class="contact-form" id="contact-form" action="https://api.web3forms.com/submit" method="POST">
          <input type="hidden" name="access_key" value="10f1c013-dd16-4547-97a6-1e4f9072377d">
          <!-- Row 1: Name & Email -->
          <div class="form-row">
            <div class="form-group">
              <label for="contact-name">NAME</label>
              <input type="text" id="contact-name" name="name" class="glass-input" required>
            </div>
            <div class="form-group">
              <label for="contact-email">EMAIL</label>
              <input type="email" id="contact-email" name="email" class="glass-input" required>
            </div>
          </div>

          <!-- Row 2: Agent, Team, or Brokerage -->
          <div class="form-group">
            <label for="contact-role">ARE YOU AN AGENT, TEAM, OR BROKERAGE?</label>
            <input type="text" id="contact-role" name="role" class="glass-input">
          </div>

          <!-- Row 3: Website (Optional) -->
          <div class="form-group">
            <label for="contact-website">WEBSITE (OPTIONAL)</label>
            <input type="url" id="contact-website" name="website" class="glass-input">
          </div>

          <!-- Row 4: Message -->
          <div class="form-group">
            <label for="contact-message">MESSAGE</label>
            <textarea id="contact-message" name="message" class="glass-input glass-textarea" rows="4"></textarea>
          </div>

          <!-- Submit Button -->
          <div class="form-submit-wrapper">
            <button type="submit" id="submit-btn" class="btn btn-glass form-submit-btn">
              <span class="btn-text">SEND MESSAGE</span>
            </button>
          </div>
        </form>
      </div>

      <!-- Global Footer -->
      <footer class="sn-global-footer">
        <a href="https://www.instagram.com/luxuryagentco" target="_blank" rel="noopener">Instagram</a>
        <a href="mailto:careers@luxuryagent.co">Careers</a>
        <span>Luxury Agent © 2026</span>
      </footer>
    </main>
  </div>
</body>

</html>
